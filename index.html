<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>yt_plane</title>
    <style>:root{--top-inset:max(56px, env(safe-area-inset-top));--ink:#e6efff;--accent:#7dffb0}html,body{overscroll-behavior:none;background:#060916;height:100%;margin:0;overflow:hidden}body{color:var(--ink);letter-spacing:.08em;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:700 14px/1.3 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}#game{touch-action:none;outline:none;width:100%;height:100%;display:block;position:fixed;top:0;bottom:0;left:0;right:0}.hidden{display:none!important}#loading{pointer-events:none;background:#060916;justify-content:center;align-items:center;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#hud{pointer-events:none;text-shadow:0 1px 3px #000c;position:fixed;top:0;bottom:0;left:0;right:0}#hud-left{left:14px;top:var(--top-inset);position:absolute}#hud-right{right:14px;top:var(--top-inset);text-align:right;position:absolute}.bar{background:#0008;border:1px solid #fff5;border-radius:3px;max-width:46vw;height:10px;overflow:hidden}.bar>div{height:100%}#shield-fill{background:linear-gradient(90deg,#39d98a,#b8ffd8)}#shield-bar.drain #shield-fill{background:repeating-linear-gradient(115deg,#7fd13a 0 6px,#c9ff7a 6px 12px) 0 0/26px 100%;animation:.6s linear infinite drain}@keyframes drain{to{background-position:-26px 0}}#meter-bar{width:96px;height:5px;margin-top:4px}#meter-fill{background:#5aa2ff}#weapon{gap:4px;margin-top:6px;display:flex}#weapon i{background:#fff2;border:1px solid #fff4;border-radius:2px;width:16px;height:6px}#weapon[data-level="1"] i:nth-child(-n+1),#weapon[data-level="2"] i:nth-child(-n+2),#weapon[data-level="3"] i:nth-child(-n+3){background:#5aa2ff;border-color:#a9c8ff;box-shadow:0 0 6px #5aa2ff}#golds{color:#ffc83d;min-height:16px;margin-top:2px;font-size:16px;line-height:1}#score{font-size:22px}#chain{color:var(--accent);min-height:20px;font-size:16px}#boss{left:50%;top:calc(var(--top-inset) + 62px);width:min(70vw,420px);position:absolute;transform:translate(-50%)}#boss-fill{background:linear-gradient(90deg,#ff3b30,#ff9a3c)}#message{text-align:center;color:#ff4b3e;opacity:0;visibility:hidden;padding:0 16px;font-size:clamp(18px,6vmin,44px);position:absolute;top:30%;left:0;right:0}#message.on{visibility:visible;animation:.45s steps(2,end) infinite blink}#vignette{pointer-events:none;background:radial-gradient(#0000 55%,#2a0e0033 80%,#1c0a0066 100%);position:fixed;top:0;bottom:0;left:0;right:0}#flash{opacity:0;position:absolute;top:0;bottom:0;left:0;right:0}#flash.go{animation:.7s ease-out flash}#flash.repair{background:radial-gradient(#5dff8f22 0%,#5dff8f66 100%)}#flash.power{background:radial-gradient(#5aa2ff18 0%,#5aa2ff5c 100%)}#flash.gold{background:radial-gradient(#ffc83d18 0%,#ffc83d5c 100%)}#flash.hurt{background:radial-gradient(#ff302000 35%,#ff302070 100%);animation-duration:.45s}@keyframes flash{0%{opacity:0}18%{opacity:1}to{opacity:0}}@keyframes blink{0%{opacity:1}50%{opacity:.25}}#dodge{right:max(18px, env(safe-area-inset-right));bottom:max(26px, env(safe-area-inset-bottom));width:84px;height:84px;color:var(--ink);pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;background:#5aa2ff33;border:2px solid #fffa;border-radius:50%;padding:0;position:absolute}#dodge:active{background:#5aa2ff88}#dodge svg{pointer-events:none;width:44px;height:44px;margin:auto;display:block}#panel{pointer-events:none;text-align:center;text-shadow:0 2px 6px #000;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:0 20px;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#panel-title{letter-spacing:.14em;margin:0;font-size:clamp(30px,10vmin,68px)}#panel-sub{color:var(--accent);min-height:18px}#panel-body{min-width:min(78vw,300px)}#panel-body .row{justify-content:space-between;gap:24px;padding:3px 0;display:flex}#panel-body .row span:first-child{color:#9fb2d6}#stages{gap:14px;margin-top:10px;display:flex}#stages button{width:58px;height:58px;color:var(--ink);font:inherit;pointer-events:auto;-webkit-tap-highlight-color:transparent;background:#0b1226aa;border:2px solid #fff6;border-radius:10px;font-size:22px}#stages button.on{border-color:var(--accent);background:#5aa2ff44;box-shadow:0 0 12px #5aa2ff88}#panel.dim{pointer-events:auto;background:#050a18b0}#menu{flex-direction:column;gap:12px;margin-top:10px;display:flex}#menu button{min-width:230px;height:50px;color:var(--ink);font:inherit;letter-spacing:.12em;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;background:#0b1226aa;border:2px solid #fff6;border-radius:10px;font-size:18px}#menu button:hover{border-color:var(--accent);background:#5aa2ff44}#menu button:focus-visible{border-color:var(--accent);background:#5aa2ff44}#panel-prompt{white-space:pre-line;margin-top:14px;line-height:2;animation:1.6s ease-in-out infinite breathe}@keyframes breathe{50%{opacity:.45}}</style>
    <!-- The Playables SDK must load before any game code. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script type="module" crossorigin src="./assets/index-D2EapYYw.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/three-core-CIAFHRnR.js">
    <link rel="modulepreload" crossorigin href="./assets/three-BAfXzfYN.js">
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="vignette"></div>

    <div id="hud" class="hidden">
      <div id="hud-left">
        <div class="bar" id="shield-bar"><div id="shield-fill"></div></div>
        <div class="bar" id="meter-bar"><div id="meter-fill"></div></div>
        <div id="weapon" data-level="1"><i></i><i></i><i></i></div>
        <div id="golds"></div>
      </div>
      <div id="hud-right">
        <div id="score">000000</div>
        <div id="chain"></div>
      </div>
      <div id="boss" class="bar hidden"><div id="boss-fill"></div></div>
      <div id="flash"></div>
      <div id="message"></div>
      <button id="dodge" type="button" aria-label="Roll">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M38 24a14 14 0 1 1-5-10.7" />
          <path d="M34 5v9h-9" />
          <path d="M10 24h28M24 24l-4 5h8z" stroke-width="2.5" />
        </svg>
      </button>
    </div>

    <div id="panel" class="hidden">
      <h1 id="panel-title"></h1>
      <div id="panel-sub"></div>
      <div id="panel-body"></div>
      <div id="stages"></div>
      <div id="menu" class="hidden"></div>
      <div id="panel-prompt"></div>
    </div>

    <div id="loading">LOADING</div>
  </body>
</html>
