<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>yt_plane</title>
    <style>:root{--top-inset:max(56px, env(safe-area-inset-top));--ink:#e6efff;--accent:#7dffb0}html,body{overscroll-behavior:none;background:#060916;height:100%;margin:0;overflow:hidden}body{color:var(--ink);letter-spacing:.08em;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:700 14px/1.3 system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif}#game{touch-action:none;outline:none;width:100%;height:100%;display:block;position:fixed;top:0;bottom:0;left:0;right:0}.hidden{display:none!important}#loading{pointer-events:none;background:#060916;justify-content:center;align-items:center;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#hud{pointer-events:none;text-shadow:0 1px 3px #000c;position:fixed;top:0;bottom:0;left:0;right:0}#hud-left{left:14px;top:var(--top-inset);position:absolute}#hud-right{right:14px;top:var(--top-inset);text-align:right;position:absolute}.bar{background:#0008;border:1px solid #fff5;border-radius:3px;max-width:46vw;height:10px;overflow:hidden}.bar>div{height:100%}#shield-fill{background:linear-gradient(90deg,#39d98a,#b8ffd8)}#meter-bar{width:96px;height:5px;margin-top:4px}#meter-fill{background:#5aa2ff}#weapon{color:#a9c8ff;margin-top:6px;font-size:12px}#golds{color:#ffc83d;min-height:16px;margin-top:2px;font-size:16px;line-height:1}#score{font-size:22px}#chain{color:var(--accent);min-height:16px;font-size:12px}#boss{left:50%;top:calc(var(--top-inset) + 62px);width:min(70vw,420px);position:absolute;transform:translate(-50%)}#boss-fill{background:linear-gradient(90deg,#ff3b30,#ff9a3c)}#message{text-align:center;opacity:0;font-size:clamp(16px,4.5vmin,30px);transition:opacity .25s;position:absolute;top:30%;left:0;right:0}#message.on{opacity:1}#message.alert{color:#ff4b3e;font-size:clamp(24px,8vmin,54px);animation:.45s steps(2,end) infinite blink}@keyframes blink{50%{opacity:.25}}#dodge{right:max(18px, env(safe-area-inset-right));bottom:max(26px, env(safe-area-inset-bottom));width:84px;height:84px;color:var(--ink);font:inherit;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;background:#5aa2ff33;border:2px solid #fffa;border-radius:50%;font-size:13px;position:absolute}#dodge:active{background:#5aa2ff88}#panel{pointer-events:none;text-align:center;text-shadow:0 2px 6px #000;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:0 20px;display:flex;position:fixed;top:0;bottom:0;left:0;right:0}#panel-title{letter-spacing:.14em;margin:0;font-size:clamp(30px,10vmin,68px)}#panel-sub{color:var(--accent);min-height:18px}#panel-body{min-width:min(78vw,300px)}#panel-body .row{justify-content:space-between;gap:24px;padding:3px 0;display:flex}#panel-body .row span:first-child{color:#9fb2d6}#panel-prompt{white-space:pre-line;margin-top:14px;line-height:2;animation:1.6s ease-in-out infinite breathe}@keyframes breathe{50%{opacity:.45}}</style>
    <!-- The Playables SDK must load before any game code. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script type="module" crossorigin src="./assets/index-CQQlIiAI.js"></script>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-left">
        <div class="bar" id="shield-bar"><div id="shield-fill"></div></div>
        <div class="bar" id="meter-bar"><div id="meter-fill"></div></div>
        <div id="weapon"></div>
        <div id="golds"></div>
      </div>
      <div id="hud-right">
        <div id="score">000000</div>
        <div id="chain"></div>
      </div>
      <div id="boss" class="bar hidden"><div id="boss-fill"></div></div>
      <div id="message"></div>
      <button id="dodge" type="button"></button>
    </div>

    <div id="panel" class="hidden">
      <h1 id="panel-title"></h1>
      <div id="panel-sub"></div>
      <div id="panel-body"></div>
      <div id="panel-prompt"></div>
    </div>

    <div id="loading">LOADING</div>
  </body>
</html>
